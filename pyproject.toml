[project]
name = "analyzing-customer-orders-using-python"
version = "0.1.0"
description = "Customer order analysis using Python data structures"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Your Name" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
python-workspace = "python_workspace.cli:main"
analyze-customer-orders = "python_workspace.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
